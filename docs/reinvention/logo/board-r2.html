<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SE;src:url(../type/fonts/Sentient-Variable.woff2);font-weight:200 700}
@font-face{font-family:GS;src:url(../type/fonts/GeneralSans-Variable.woff2);font-weight:200 700}
body{margin:0;background:#ecebe6;color:#151719;font-family:GS;-webkit-font-smoothing:antialiased}
.row{display:grid;grid-template-columns:230px repeat(5,auto) 1fr 300px;align-items:center;gap:26px;padding:20px 28px;border-bottom:1px solid #d3d2cb}
.lab{font-size:13px;line-height:1.35}.lab b{display:block;font-size:15px;margin-bottom:2px}
.dk{background:#1d1f22;color:#eeede8;padding:12px;border-radius:10px;display:flex;gap:14px;align-items:center}
.wm{font-family:SE;font-weight:500;font-size:28px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.tile{width:32px;height:32px;border-radius:8px;background:#1d1f22;color:#eeede8;display:grid;place-items:center}
svg{display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<!-- R1 refined door swing: thinner wall, larger swing, tighter gap so it reads as one letter b -->
<symbol id="R1" viewBox="0 0 32 32"><rect x="5" y="2.5" width="4.6" height="27" rx="1.4"/><path d="M11.6 29.5V12A17.5 17.5 0 0 1 29.1 29.5z"/></symbol>
<!-- R2 D-swing: a wall and a full half-swing make a capital D: the door you walk through for a walkthrough -->
<symbol id="R2" viewBox="0 0 32 32"><rect x="5" y="3" width="4.8" height="26" rx="1.4"/><path d="M12.2 3h3.3a13 13 0 0 1 0 26h-3.3z"/></symbol>
<!-- R3 Plan b: plan-notation b, wall as a solid stem and the swing as a drawn arc + leaf (lighter at small sizes) -->
<symbol id="R3" viewBox="0 0 32 32"><rect x="5" y="2.5" width="5" height="27" rx="1.4"/><path d="M12.5 27.5h14.5M12.5 27.5V13A14.5 14.5 0 0 1 27 27.5" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<div class="row"><div class="lab"><b>R1 · Door swing b, refined</b>Thinner wall, bigger swing, tighter gap. One letter, not two bars.</div><svg width="16" height="16" fill="currentColor"><use href="#R1"/></svg><svg width="20" height="20" fill="currentColor"><use href="#R1"/></svg><svg width="32" height="32" fill="currentColor"><use href="#R1"/></svg><svg width="64" height="64" fill="currentColor"><use href="#R1"/></svg><div class="dk"><svg width="16" height="16" fill="currentColor"><use href="#R1"/></svg><svg width="32" height="32" fill="currentColor"><use href="#R1"/></svg></div><div class="tile"><svg width="20" height="20" fill="currentColor"><use href="#R1"/></svg></div><div class="wm"><svg width="26" height="26" fill="currentColor"><use href="#R1"/></svg>BetterDesk</div></div><div class="row"><div class="lab"><b>R2 · D-swing</b>Wall + half swing = a capital D and a doorway seen from above.</div><svg width="16" height="16" fill="currentColor"><use href="#R2"/></svg><svg width="20" height="20" fill="currentColor"><use href="#R2"/></svg><svg width="32" height="32" fill="currentColor"><use href="#R2"/></svg><svg width="64" height="64" fill="currentColor"><use href="#R2"/></svg><div class="dk"><svg width="16" height="16" fill="currentColor"><use href="#R2"/></svg><svg width="32" height="32" fill="currentColor"><use href="#R2"/></svg></div><div class="tile"><svg width="20" height="20" fill="currentColor"><use href="#R2"/></svg></div><div class="wm"><svg width="26" height="26" fill="currentColor"><use href="#R2"/></svg>BetterDesk</div></div><div class="row"><div class="lab"><b>R3 · Plan-notation b</b>Solid wall, drawn swing and leaf, as on a floor plan.</div><svg width="16" height="16" fill="currentColor"><use href="#R3"/></svg><svg width="20" height="20" fill="currentColor"><use href="#R3"/></svg><svg width="32" height="32" fill="currentColor"><use href="#R3"/></svg><svg width="64" height="64" fill="currentColor"><use href="#R3"/></svg><div class="dk"><svg width="16" height="16" fill="currentColor"><use href="#R3"/></svg><svg width="32" height="32" fill="currentColor"><use href="#R3"/></svg></div><div class="tile"><svg width="20" height="20" fill="currentColor"><use href="#R3"/></svg></div><div class="wm"><svg width="26" height="26" fill="currentColor"><use href="#R3"/></svg>BetterDesk</div></div></body></html>
